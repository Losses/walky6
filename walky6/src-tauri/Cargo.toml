[package]
name = "walky6"
version = "1.0.0"
edition = "2021"

[lib]
name = "walky6_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "custom-protocol"] }
tauri-plugin-dialog = "2"
sneakerweb = { path = "../../vendor/sneakerweb" }
anyhow = "1.0.102"
smol = "2.0.2"
serde = { version = "1", features = ["derive"] }
regex-lite = "0.1"
url = "2"
mime_guess2 = "2.3.1"
dirs = "6"
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
