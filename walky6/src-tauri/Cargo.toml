[package]
name = "walky6"
version = "1.0.0"
edition = "2021"

[lib]
name = "walky6_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "custom-protocol"] }
tauri-plugin-dialog = "2"
sneakerweb = { path = "../../vendor/sneakerweb" }
anyhow = "1.0.102"
smol = "2.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
url = "2"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
