<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Importing...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #c0c0c0;
  font-family: "Pixelated SM_MS", "MS Sans Serif", Arial, sans-serif;
  font-size: 11px;
}
.wrapper {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
}
.window {
  background: #c0c0c0;
  box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px grey, inset 2px 2px #fff;
  padding: 3px;
  width: 420px;
}
.title-bar {
  background: linear-gradient(90deg, #000080, #1084d0);
  padding: 3px 2px 3px 3px;
  display: flex; align-items: center;
}
.title-bar-text {
  font-weight: bold; color: white; letter-spacing: 0;
}
.window-body { padding: 16px 12px; }
.content { padding: 8px 0; }
.progress-row { display: flex; align-items: center; gap: 12px; }
.loading-icon {
  width: 48px; height: 48px;
  background: url("/__assets__/data-loading.svg") no-repeat;
  background-size: 384px 48px;
  animation: spin 1s steps(8) infinite;
  flex-shrink: 0;
}
@keyframes spin {
  0% { background-position: 0px 0px; }
  100% { background-position: -384px 0px; }
}
.progress-bar-wrap { flex: 1; }
.progress-indicator {
  height: 32px; position: relative;
  box-shadow: inset -2px -2px #dfdfdf, inset 2px 2px #808080;
  padding: 4px;
}
.progress-indicator-bar {
  height: 100%; display: block; background-color: #000080;
  transition: width 0.3s ease;
}
.entry-count {
  margin-top: 4px; text-align: right;
  font-size: 10px; color: #444;
}
.message {
  margin-top: 12px; text-align: center; color: #000;
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Importing...</div>
    </div>
    <div class="window-body">
      <div class="content">
        <div class="progress-row">
          <div class="loading-icon"></div>
          <div class="progress-bar-wrap">
            <div class="progress-indicator">
              <span class="progress-indicator-bar" id="bar" style="width:0%"></span>
            </div>
            <div class="entry-count" id="entries"></div>
          </div>
        </div>
        <p class="message" id="msg">Preparing import...</p>
      </div>
    </div>
  </div>
</div>
<script>
(function() {
  var bar = document.getElementById("bar");
  var msg = document.getElementById("msg");
  var entries = document.getElementById("entries");
  var timer = null;

  function poll() {
    fetch("/__progress_api__")
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.is_importing) {
          var pct = 0;
          if (d.total_bytes > 0) {
            pct = Math.min(100, Math.floor(d.processed_bytes / d.total_bytes * 100));
          }
          bar.style.width = pct + "%";

          if (d.phase === "decoding" || d.phase === "importing") {
            var pe = d.processed_entries || 0;
            entries.textContent = pe + " entries processed";
            msg.textContent = d.phase === "decoding"
              ? "Decoding entries... (" + pct + "%)"
              : "Importing entries... (" + pct + "%)";
          } else if (d.phase === "done") {
            bar.style.width = "100%";
            entries.textContent = (d.processed_entries || 0) + " entries imported";
            msg.textContent = "Import complete!";
            stop();
          } else if (d.phase === "error") {
            msg.textContent = "Import failed: " + (d.message || "unknown error");
            entries.textContent = "";
            bar.style.width = "100%";
            bar.style.backgroundColor = "#800000";
            stop();
          } else {
            msg.textContent = "Preparing import...";
          }
        } else {
          msg.textContent = "Waiting for file selection...";
          entries.textContent = "";
        }
      })
      .catch(function() {});
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  timer = setInterval(poll, 200);
  poll();
})();
</script>
</body>
</html>
