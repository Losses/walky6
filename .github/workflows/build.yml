name: Build Tauri App

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust targets for macOS universal build
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup sneakerweb vendor dependency (Bash)
        shell: bash
        run: |
          git config --global core.autocrlf false
          mkdir -p vendor
          git clone https://codeberg.org/worm-blossom/sneakerweb vendor/sneakerweb
          cd vendor/sneakerweb
          git checkout 888cf132207a2bf0622a5633a2d347e9e910538c
          git apply ../../patches/sneakerweb.patch

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install
        working-directory: walky6

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: walky6
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walky6-binaries-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.zip
            target/universal-apple-darwin/release/bundle/**/*.dmg
            target/universal-apple-darwin/release/bundle/**/*.zip
            walky6/src-tauri/target/release/bundle/**/*.deb
            walky6/src-tauri/target/release/bundle/**/*.AppImage
            walky6/src-tauri/target/release/bundle/**/*.msi
            walky6/src-tauri/target/release/bundle/**/*.exe
            walky6/src-tauri/target/release/bundle/**/*.dmg
            walky6/src-tauri/target/release/bundle/**/*.zip
            walky6/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            walky6/src-tauri/target/universal-apple-darwin/release/bundle/**/*.zip
